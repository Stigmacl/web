<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Subasta 360</title>
<link rel="stylesheet" href="css/styles.css">
<style>
    body { display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1 { font-size: 1.4rem; margin: 0 0 4px; text-align: center; }
    .login-card p.muted { text-align: center; margin: 0 0 8px; }
    .login-card .btn { width: 100%; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <h1>Subasta 360</h1>
        <p class="muted">Acceso admin</p>
        <form id="loginForm">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" autofocus>
            <button type="submit" class="btn btn-primary" id="loginBtn">Ingresar</button>
        </form>
        <p class="muted" style="text-align:center; margin-top:16px;"><a href="index.html">← Volver a la pantalla principal</a></p>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
