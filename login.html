<!doctype html>
<head>
    <title>Gestión Supervisor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Outfit:300,400,600,700&display=swap" rel="stylesheet">
    <!-- FontAwesome (modern) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cargar CSS del login original modificado la ruta -->
    <link rel="stylesheet" href="login/css/style.css">
    
    <style>
        .custom-select-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .custom-select-wrapper select {
            width: 100%;
            height: 50px;
            padding: 10px 45px 10px 20px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
        }
        .custom-select-wrapper select option { background: #002D56; color: #fff; }
        .custom-select-wrapper select:focus {
            outline: none; background: rgba(255, 255, 255, 0.2); border-color: #F37021;
        }
        .custom-select-wrapper i.fa-chevron-down {
            position: absolute; right: 20px; top: 17px; color: rgba(255,255,255,0.7); pointer-events: none;
        }
        /* BancoEstado Colors override */
        .bg-be-dark { background-color: #002D56; }
        .text-be-orange { color: #F37021; }
        .btn-be-orange { background-color: #F37021 !important; border: none !important; color: white !important; font-weight: bold; border-radius: 8px;}
        .btn-be-orange:hover { background-color: #e26112 !important; box-shadow: 0 4px 15px rgba(243, 112, 33, 0.4); }
        
        /* Estilos para mensajes de error/carga */
        .alert-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        .alert-info {
            background-color: #eef;
            color: #33c;
            border: 1px solid #ccf;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<section class="ftco-section h-100 min-vh-100 d-flex align-items-center bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-12 col-lg-10 shadow-lg rounded" style="overflow: hidden;">
                <div class="wrap d-md-flex">
                    <!-- Sección Visual -->
                    <div class="text-wrap p-4 p-lg-5 text-center d-flex align-items-center order-md-last bg-be-dark" style="background-image: radial-gradient(circle at top right, #004B87, #002D56);">
                        <div class="text w-100">
                            <div class="mb-4" style="width: 80px; height: 80px; background: #F37021; border-radius: 16px; display: inline-flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                                <i class="fa-solid fa-list-check" style="font-size: 40px; color: white;"></i>
                            </div>
                            <h2>Gestión Supervisor</h2>
                            <p>Plataforma centralizada para la gestión de dotación y seguimiento de errores</p>
                            <p class="text-white-50 mt-4 small"><i class="fa-solid fa-shield-halved"></i> Integración Backend Azure (Mockup)</p>
                        </div>
                    </div>
                    
                    <!-- Formulario Login -->
                    <div class="login-wrap p-4 p-lg-5 bg-white">
                        <div class="d-flex mb-4">
                            <div class="w-100">
                                <h3 class="mb-2" style="font-weight: 700; color: #004B87;">Iniciar Sesión</h3>
                                <p class="text-muted small">Seleccione su perfil y acceda al dashboard</p>
                            </div>
                        </div>

                        <!-- Mensaje de alerta -->
                        <div id="alert-message" class="alert-message"></div>

                        <form id="login-form" class="signin-form mt-4">
                            
                            <div class="form-group mb-4">
                                <label class="label text-muted d-block mb-2" style="font-weight:600; font-size:12px; text-transform:uppercase;">Usuarios Disponibles</label>
                                <div class="custom-select-wrapper">
                                    <select id="login-supervisor-select" class="form-control" style="color:#333; border:2px solid #e1e5eb; background:#f8f9fa; padding-left:15px; font-weight:600;" required>
                                        <option value="" disabled selected>-- Cargando usuarios... --</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down" style="color:#aaa;"></i>
                                </div>
                            </div>
                            
                            <div class="form-group mb-4 mt-5">
                                <button type="button" onclick="performLogin()" id="login-btn" class="form-control btn btn-be-orange submit px-3 py-3 d-flex justify-content-center align-items-center" style="gap:8px; font-size: 16px;">
                                    Entrar al Dashboard <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                </button>
                            </div>
                            
                            <div class="form-group mt-5 text-center">
                                <p class="small text-muted mb-0"><i class="fa-solid fa-cloud"></i> Dashboard Supervisor.</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="login/js/jquery.min.js"></script>
<script src="login/js/popper.js"></script>
<script src="login/js/bootstrap.min.js"></script>

<script>
let LOGIN_DATA = {};

function norm(txt) {
    return (txt || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toUpperCase();
}

function esVigente(estado) {
    const e = norm(estado);
    return (
        e === 'VIGENTE' ||
        e === 'ACTIVO' ||
        e === ''
    );
}

function showAlert(message, type = 'error') {
    const alertDiv = document.getElementById('alert-message');
    alertDiv.textContent = message;
    alertDiv.className = `alert-message alert-${type}`;
    alertDiv.style.display = 'block';
}

function hideAlert() {
    const alertDiv = document.getElementById('alert-message');
    alertDiv.style.display = 'none';
}

function addOption(nombre, isAdmin = false) {
    if (!nombre) return;

    const select = document.getElementById('login-supervisor-select');
    const opt = document.createElement('option');

    // Usamos el nombre limpio como valor
    opt.value = nombre;
    
    // Guardamos el rol en un atributo de datos para recuperarlo fácilmente
    opt.setAttribute('data-role', isAdmin ? 'admin' : 'supervisor');
    
    opt.innerText = isAdmin
        ? nombre + ' (Administrador/Jefatura)'
        : nombre + ' (Supervisor)';

    if (isAdmin) {
        opt.style.background = '#F37021';
        opt.style.fontWeight = 'bold';
    }

    select.appendChild(opt);
}

async function cargarUsuarios() {
    sessionStorage.clear();
    hideAlert();

    const select = document.getElementById('login-supervisor-select');

    try {
        // Limpiar opciones previas
        select.innerHTML = '<option value="" disabled selected>-- Cargando usuarios... --</option>';

        // Obtener usuarios desde el backend
        const response = await fetch('api/get_login_users.php');
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data.status !== 'success') {
            throw new Error(data.message || 'Error desconocido al cargar usuarios');
        }

        LOGIN_DATA = data;

        const supUsados = {};
        const adminsUsados = {};

        // Procesar jefaturas/administradores primero
        if (data.admins && Array.isArray(data.admins)) {
            data.admins.forEach(admin => {
                if (admin && !adminsUsados[norm(admin)]) {
                    adminsUsados[norm(admin)] = true;
                    addOption(admin, true);
                }
            });
        }

        // Procesar supervisores
        if (data.supervisors && Array.isArray(data.supervisors)) {
            data.supervisors.forEach(sup => {
                if (sup && !supUsados[norm(sup)]) {
                    supUsados[norm(sup)] = true;
                    addOption(sup, false);
                }
            });
        }

        // Si no hay usuarios, mostrar fallback
        if (Object.keys(adminsUsados).length === 0 && Object.keys(supUsados).length === 0) {
            showAlert('No se encontraron usuarios en el sistema. Contacte al administrador.', 'error');
            addOption('CRISTIAN', true);
            addOption('MILADY', true);
            addOption('MONICA', true);
        } else {
            select.innerHTML = '<option value="" disabled selected>-- Seleccione su nombre --</option>' + select.innerHTML;
        }

    } catch (error) {
        console.error('Error cargando usuarios:', error);
        showAlert(`Error: ${error.message}`, 'error');

        // Fallback mínimo
        select.innerHTML = '<option value="" disabled selected>-- Seleccione su nombre --</option>';
        addOption('CRISTIAN', true);
        addOption('MILADY', true);
        addOption('MONICA', true);
    }
}

async function performLogin() {
    const select = document.getElementById('login-supervisor-select');
    const selectedOption = select.options[select.selectedIndex];
    
    if (!selectedOption || !selectedOption.value) {
        showAlert('Por favor, seleccione un usuario', 'error');
        return;
    }

    hideAlert();

    const loginBtn = document.getElementById('login-btn');
    const originalText = loginBtn.innerHTML;
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loading-spinner"></span> Validando...';

    try {
        const clean = selectedOption.value;
        const role = selectedOption.getAttribute('data-role');

        // Validar en backend para mayor seguridad
        const validateResponse = await fetch('api/validate_login.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                usuario: clean
            })
        });

        const validateData = await validateResponse.json();

        if (validateData.status !== 'success') {
            console.error('Respuesta del servidor:', validateData);
            throw new Error(validateData.message || 'Error en la validación del servidor');
        }

        // Guardar datos en sessionStorage y localStorage para persistencia total
        sessionStorage.setItem('loggedInSupervisorName', clean);
        sessionStorage.setItem('userRole', validateData.rol);
        localStorage.setItem('loggedInSupervisorName', clean);
        localStorage.setItem('userRole', validateData.rol);

        // Si es admin, guardar los supervisores asociados
        if (validateData.rol === 'admin' && validateData.supervisores_asociados) {
            const supsJson = JSON.stringify(validateData.supervisores_asociados);
            sessionStorage.setItem('loggedInJefaturaSups', supsJson);
            localStorage.setItem('loggedInJefaturaSups', supsJson);
        }

        showAlert(`¡Bienvenido ${clean}!`, 'success');

        // Redireccionar según rol
        setTimeout(() => {
            if (validateData.rol === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        }, 500);

    } catch (error) {
        console.error('Error en login:', error);
        showAlert(`Error: ${error.message}`, 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = originalText;
    }
}

// Cargar usuarios al iniciar
document.addEventListener('DOMContentLoaded', cargarUsuarios);

// Permitir Enter para enviar el formulario
document.getElementById('login-form').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        performLogin();
    }
});
</script>

</body>
</html>
