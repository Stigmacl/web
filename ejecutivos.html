<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Equipo Directo - Gestión Supervisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { be: { blue: '#004B87', darkblue: '#002D56', orange: '#F37021', light: '#F8FAFC' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-be-light text-slate-800 font-sans h-screen flex overflow-hidden">

    <div id="dashboard-container" class="w-full h-full flex mt-0">
        <aside id="shared-sidebar"
            class="bg-be-darkblue text-white w-64 flex-shrink-0 flex flex-col transition-all duration-300 relative z-20 shadow-xl">
        </aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 relative z-10">
            <header
                class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 z-10 shadow-sm w-full">
                <h1 class="text-lg font-bold text-be-blue uppercase tracking-tight">Catálogo de mi Dotación</h1>
            </header>

            <div class="flex-1 overflow-auto p-8 relative w-full fade-in">
                <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-be-darkblue">Mi Equipo Directo</h2>
                        <p class="text-sm text-gray-500 font-medium mt-1">Gestiona y edita la información de los ejecutivos asignados a tu supervisión.</p>
                    </div>
                    <div class="bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-bold border border-blue-200 shadow-sm transition-all duration-300">
                        Total: <span id="count-ejecutivos-badge">0</span> registros
                    </div>
                </div>

                <!-- Contenedor de Tarjetas -->
                <div id="ejecutivos-cards-container"
                    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
                    <!-- Tarjetas generadas por JS -->
                    <div class="col-span-full py-20 text-center animate-pulse">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-be-blue/20 mb-4 block mx-auto"></i>
                        <p class="text-gray-400 font-medium italic">Cargando dotación...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Edición Perfil -->
    <div id="edit-profile-modal" class="fixed inset-0 z-[300] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeEditModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden animate-zoomIn">
            <div class="bg-be-darkblue p-6 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-user-gear text-be-orange text-xl"></i>
                    <h3 class="font-bold text-lg">Editar Perfil del Ejecutivo</h3>
                </div>
                <button onclick="closeEditModal()" class="text-white/50 hover:text-white transition-colors"><i
                        class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="edit-rut-hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Nombre Completo</label>
                        <input type="text" id="edit-nombre"
                            class="w-full bg-gray-50 border border-gray-100 rounded-lg p-2.5 text-sm font-bold text-gray-700"
                            readonly disabled>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Usuario</label>
                        <input type="text" id="edit-usuario"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Cumpleaños</label>
                        <input type="text" id="edit-nacimiento" placeholder="Ej: 15/08"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium">
                    </div>
                    <div class="col-span-2 border-t pt-4 mt-2">
                        <p class="text-[10px] font-bold text-be-blue uppercase tracking-widest mb-3">Información de
                            Contrato</p>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Fecha Ingreso</label>
                        <input type="date" id="edit-ingreso"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium text-gray-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Vencimiento
                            (Opcional)</label>
                        <input type="date" id="edit-vencimiento"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium text-gray-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Tipo de Contrato</label>
                        <select id="edit-tipo-contrato"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium cursor-pointer">
                            <option value="INDEFINIDO">Indefinido</option>
                            <option value="FIJO">Fijo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Jornada</label>
                        <select id="edit-jornada"
                            class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium cursor-pointer">
                            <option value="40">40 Horas</option>
                            <option value="25">25 Horas</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Modalidad</label>
                        <select id="edit-modalidad" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium cursor-pointer">
                            <option value="PRESENCIAL">Presencial</option>
                            <option value="TELETRABAJO">Teletrabajo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Código VPX (Teletrabajo)</label>
                        <input type="text" id="edit-vpx" placeholder="Ej: W10-L545-VMXXX" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-be-blue/20 outline-none font-medium">
                    </div>
                </div>
            </div>
            <div class="p-5 bg-gray-50 border-t flex gap-2">
                <button onclick="closeEditModal()"
                    class="flex-1 py-2 bg-white border border-gray-200 text-gray-400 font-black rounded-xl text-[10px] hover:bg-gray-100 transition-all uppercase">Cancelar</button>
                <button onclick="saveExecutiveEdit()"
                    class="flex-1 py-2 bg-be-blue text-white font-black rounded-xl text-[10px] shadow-lg shadow-be-blue/20 hover:bg-be-darkblue transition-all uppercase flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
                    Guardar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/stores.js"></script>
    <script src="js/api.js"></script>
    <script src="js/db-init.js"></script>
    <script src="js/ui-components.js"></script>
    <script src="js/ejecutivos.js"></script>
    <script>
        window.addEventListener('db_ready', () => {
            if (typeof initEjecutivos === 'function') initEjecutivos();
            else if (typeof renderEjecutivos === 'function') renderEjecutivos();
        });
    </script>
</body>

</html>
